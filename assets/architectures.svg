<svg xmlns="http://www.w3.org/2000/svg" width="840" height="502" viewBox="0 0 840 502" role="img" aria-label="Architectures I like: Clean Architecture, Domain-Driven Design, MVVM, Feature-First and modular design">
<title>Architectures I like: Clean Architecture, Domain-Driven Design, MVVM, Feature-First and modular design</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="839" height="501" rx="16" fill="url(#bg)" stroke="#22304d"/>
<style>
  .ct { font: 700 16px Helvetica, Arial, 'Liberation Sans', sans-serif; fill: #e6edf3; }
  .cd { font: 400 12.5px Helvetica, Arial, 'Liberation Sans', sans-serif; fill: #8b98b0; }
  .mini { font: 600 9.5px Helvetica, Arial, 'Liberation Sans', sans-serif; }
  .tree { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .pl { font: 700 10.5px Helvetica, Arial, 'Liberation Sans', sans-serif; letter-spacing: 1.2px; fill: #fbbf24; }
  .pc { font: 500 12px Helvetica, Arial, 'Liberation Sans', sans-serif; fill: #e6edf3; }
  .in { animation: in .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
<g class="in" style="animation-delay:0.00s"><rect x="24.0" y="24" width="388.0" height="196" rx="12" fill="#141f36" stroke="#22304d"/><rect x="24.0" y="42" width="3" height="22" rx="1.5" fill="#a78bfa"/><text class="ct" x="44.0" y="59">Clean Architecture</text><text class="cd" x="44.0" y="88">Business rules sit in the center</text><text class="cd" x="44.0" y="107">and frameworks stay at the edge.</text><text class="cd" x="44.0" y="126">Dependencies only point inward,</text><text class="cd" x="44.0" y="145">so the core is easy to test and</text><text class="cd" x="44.0" y="164">hard to break.</text><circle cx="328.0" cy="132" r="60" fill="none" stroke="#34d399" stroke-opacity=".5" stroke-dasharray="3 5"/><circle cx="328.0" cy="132" r="41" fill="none" stroke="#38bdf8" stroke-opacity=".6" stroke-dasharray="3 5"/><circle cx="328.0" cy="132" r="22" fill="#a78bfa" fill-opacity=".2" stroke="#a78bfa"/><text x="328.0" y="135.5" text-anchor="middle" class="mini" fill="#e6edf3">Domain</text><text x="328.0" y="87" text-anchor="middle" class="mini" fill="#38bdf8">Use cases</text><text x="328.0" y="200" text-anchor="middle" class="mini" fill="#34d399">UI, DB, APIs</text><circle r="2.6" fill="#e6edf3"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M 271.6 111.5 L 305.4 123.8"/><animate attributeName="opacity" dur="2.4s" begin="0.0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.2;.8;1"/></circle><circle r="2.6" fill="#e6edf3"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M 384.4 111.5 L 350.6 123.8"/><animate attributeName="opacity" dur="2.4s" begin="0.6s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.2;.8;1"/></circle><circle r="2.6" fill="#e6edf3"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M 384.4 152.5 L 350.6 140.2"/><animate attributeName="opacity" dur="2.4s" begin="1.2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.2;.8;1"/></circle><circle r="2.6" fill="#e6edf3"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M 271.6 152.5 L 305.4 140.2"/><animate attributeName="opacity" dur="2.4s" begin="1.8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.2;.8;1"/></circle></g>
<g class="in" style="animation-delay:0.15s"><rect x="428.0" y="24" width="388.0" height="196" rx="12" fill="#141f36" stroke="#22304d"/><rect x="428.0" y="42" width="3" height="22" rx="1.5" fill="#34d399"/><text class="ct" x="448.0" y="59">Domain-Driven Design</text><text class="cd" x="448.0" y="88">I shape the code around the</text><text class="cd" x="448.0" y="107">language of the business. Clear</text><text class="cd" x="448.0" y="126">boundaries between contexts</text><text class="cd" x="448.0" y="145">keep a growing system</text><text class="cd" x="448.0" y="164">understandable.</text><rect x="672.0" y="66" width="120" height="50" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".7" stroke-dasharray="5 4"/><text x="680.0" y="81" class="mini" fill="#34d399">Catalog</text><polyline points="700.0,99 732.0,93 764.0,101" fill="none" stroke="#8b98b0" stroke-opacity=".6"/><circle cx="700.0" cy="99" r="4.5" fill="#111a2e" stroke="#e6edf3" stroke-opacity=".8"/><circle cx="732.0" cy="93" r="4.5" fill="#111a2e" stroke="#e6edf3" stroke-opacity=".8"/><circle cx="764.0" cy="101" r="4.5" fill="#111a2e" stroke="#e6edf3" stroke-opacity=".8"/><rect x="672.0" y="148" width="120" height="50" rx="10" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".7" stroke-dasharray="5 4"/><text x="680.0" y="163" class="mini" fill="#34d399">Orders</text><polyline points="700.0,181 732.0,175 764.0,183" fill="none" stroke="#8b98b0" stroke-opacity=".6"/><circle cx="700.0" cy="181" r="4.5" fill="#111a2e" stroke="#e6edf3" stroke-opacity=".8"/><circle cx="732.0" cy="175" r="4.5" fill="#111a2e" stroke="#e6edf3" stroke-opacity=".8"/><circle cx="764.0" cy="183" r="4.5" fill="#111a2e" stroke="#e6edf3" stroke-opacity=".8"/><line x1="732.0" y1="116" x2="732.0" y2="148" stroke="#8b98b0" stroke-dasharray="2 3"/><text x="740.0" y="136" class="mini" fill="#8b98b0">event</text><circle r="4" fill="#fbbf24"><animateMotion dur="2s" repeatCount="indefinite" path="M 732.0 118 L 732.0 146"/><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.15;.85;1"/></circle></g>
<g class="in" style="animation-delay:0.30s"><rect x="24.0" y="236" width="388.0" height="196" rx="12" fill="#141f36" stroke="#22304d"/><rect x="24.0" y="254" width="3" height="22" rx="1.5" fill="#f472b6"/><text class="ct" x="44.0" y="271">MVVM</text><text class="cd" x="44.0" y="300">Views stay thin. State and logic</text><text class="cd" x="44.0" y="319">live in the ViewModel, where I</text><text class="cd" x="44.0" y="338">can unit test them without</text><text class="cd" x="44.0" y="357">touching the UI.</text><rect x="274.0" y="276" width="108" height="30" rx="8" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".7"/><text x="328.0" y="295" text-anchor="middle" class="mini" fill="#e6edf3">View</text><rect x="274.0" y="326" width="108" height="30" rx="8" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".7"/><text x="328.0" y="345" text-anchor="middle" class="mini" fill="#e6edf3">ViewModel</text><rect x="274.0" y="376" width="108" height="30" rx="8" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".7"/><text x="328.0" y="395" text-anchor="middle" class="mini" fill="#e6edf3">Model</text><line x1="314.0" y1="306" x2="314.0" y2="326" stroke="#8b98b0"/><line x1="342.0" y1="306" x2="342.0" y2="326" stroke="#8b98b0"/><line x1="328.0" y1="356" x2="328.0" y2="376" stroke="#8b98b0"/><circle r="3" fill="#f472b6"><animateMotion dur="1.6s" repeatCount="indefinite" path="M 314.0 307 L 314.0 325"/></circle><circle r="3" fill="#a78bfa"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite" path="M 342.0 325 L 342.0 307"/></circle><circle r="3" fill="#34d399"><animateMotion dur="1.6s" begin=".4s" repeatCount="indefinite" path="M 328.0 357 L 328.0 375"/></circle><text x="348.0" y="319.5" class="mini" fill="#8b98b0">binding</text></g>
<g class="in" style="animation-delay:0.45s"><rect x="428.0" y="236" width="388.0" height="196" rx="12" fill="#141f36" stroke="#22304d"/><rect x="428.0" y="254" width="3" height="22" rx="1.5" fill="#38bdf8"/><text class="ct" x="448.0" y="271">Feature-First &amp; Modular</text><text class="cd" x="448.0" y="300">I group code by feature, not by</text><text class="cd" x="448.0" y="319">file type. Each module can be</text><text class="cd" x="448.0" y="338">built, tested and removed on its</text><text class="cd" x="448.0" y="357">own.</text><rect x="668.0" width="128" height="17" rx="5" fill="#38bdf8" fill-opacity=".16" y="293.5"><animate attributeName="y" dur="4.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.333;.667" values="293.5;311.5;329.5"/></rect><text x="674.0" y="288" class="tree" fill="#38bdf8" xml:space="preserve">features/</text><text x="674.0" y="306" class="tree" fill="#e6edf3" xml:space="preserve">├─ auth/</text><text x="674.0" y="324" class="tree" fill="#e6edf3" xml:space="preserve">├─ chat/</text><text x="674.0" y="342" class="tree" fill="#e6edf3" xml:space="preserve">└─ profile/</text><text x="674.0" y="360" class="tree" fill="#8b98b0" xml:space="preserve">   ├─ data</text><text x="674.0" y="378" class="tree" fill="#8b98b0" xml:space="preserve">   ├─ domain</text><text x="674.0" y="396" class="tree" fill="#8b98b0" xml:space="preserve">   └─ ui</text></g>
<text class="pl" x="24" y="470">PRINCIPLES I LEAN ON</text><g class="in" style="animation-delay:0.60s"><rect x="183.3" y="454" width="62.2" height="26" rx="13" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".4"/><text class="pc" x="214.4" y="471.5" text-anchor="middle">SOLID</text></g><g class="in" style="animation-delay:0.68s"><rect x="253.5" y="454" width="146.4" height="26" rx="13" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".4"/><text class="pc" x="326.7" y="471.5" text-anchor="middle">Dependency Injection</text></g><g class="in" style="animation-delay:0.76s"><rect x="407.8" y="454" width="129.4" height="26" rx="13" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".4"/><text class="pc" x="472.5" y="471.5" text-anchor="middle">Repository Pattern</text></g><g class="in" style="animation-delay:0.84s"><rect x="545.2" y="454" width="129.4" height="26" rx="13" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".4"/><text class="pc" x="609.9" y="471.5" text-anchor="middle">Testable by design</text></g>
</svg>
