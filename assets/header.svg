<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-label="Muhammet Emre Kemancı, Software Developer">
<title>Muhammet Emre Kemancı, Software Developer</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="839" height="229" rx="16" fill="url(#bg)" stroke="#22304d"/>
<style>
  .hi { font: 500 15px Helvetica, Arial, 'Liberation Sans', sans-serif; fill: #8b98b0; letter-spacing: .5px; }
  .name { font: 700 34px Helvetica, Arial, 'Liberation Sans', sans-serif; fill: #e6edf3; }
  .type { font: 600 22px Helvetica, Arial, 'Liberation Sans', sans-serif; fill: #38bdf8; }
  .prompt { font: 500 20px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b98b0; }
  .pill { font: 600 12px Helvetica, Arial, 'Liberation Sans', sans-serif; fill: #34d399; }
  .loc { font: 500 12px Helvetica, Arial, 'Liberation Sans', sans-serif; fill: #8b98b0; }
  .ring-label { font: 600 10px Helvetica, Arial, 'Liberation Sans', sans-serif; letter-spacing: 1px; }
  .fade { animation: fade 1s ease-out both; }
  .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
<defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#22304d"/></pattern><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient><clipPath id="card"><rect x="1" y="1" width="838" height="228" rx="15"/></clipPath></defs>
<rect x="1" y="1" width="838" height="228" rx="15" fill="url(#grid)" opacity=".6"/>
<g class="fade d1"><text class="hi" x="40" y="62">HI, I'M</text></g>
<g class="fade d2"><text class="name" x="40" y="102">Muhammet Emre Kemancı</text></g>
<g class="fade d2"><text class="type" x="40" y="148">Software Developer</text><rect x="251.4" y="129" width="3" height="23" rx="1.5" fill="#38bdf8"><animate attributeName="opacity" dur="1.1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0"/></rect></g>
<g class="fade d3"><rect x="40" y="172" width="199" height="28" rx="14" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/><circle cx="57" cy="186" r="4" fill="#34d399"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="57" cy="186" r="3.5" fill="#34d399"/><text class="pill" x="69" y="190.5">Open to new opportunities</text><text class="loc" x="253" y="190.5">Istanbul, Türkiye</text></g>
<g clip-path="url(#card)"><circle cx="716" cy="110" r="70" fill="url(#glow)"><animate attributeName="r" values="62;78;62" dur="5s" repeatCount="indefinite"/></circle><g><circle cx="716" cy="110" r="88" fill="none" stroke="#34d399" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 7"/><animateTransform attributeName="transform" type="rotate" from="0 716 110" to="360 716 110" dur="40s" repeatCount="indefinite"/></g><circle r="3.5" fill="#34d399"><animateMotion dur="13.3s" repeatCount="indefinite" path="M 804 110 A 88 88 0 1 1 628 110 A 88 88 0 1 1 804 110"/></circle><g><circle cx="716" cy="110" r="66" fill="none" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 7"/><animateTransform attributeName="transform" type="rotate" from="0 716 110" to="-360 716 110" dur="28s" repeatCount="indefinite"/></g><circle r="3.5" fill="#38bdf8"><animateMotion dur="9.3s" repeatCount="indefinite" path="M 782 110 A 66 66 0 1 0 650 110 A 66 66 0 1 0 782 110"/></circle><circle cx="716" cy="110" r="36" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-width="1.5"/><text x="716" y="114" text-anchor="middle" class="ring-label" fill="#e6edf3">DOMAIN</text><text x="716" y="37" text-anchor="middle" class="ring-label" fill="#38bdf8">APPLICATION</text><text x="716" y="212" text-anchor="middle" class="ring-label" fill="#34d399">API &amp; INFRA</text></g>
</svg>
